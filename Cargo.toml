[workspace]
members = [
  "crates/swallowtail-acp-client",
  "crates/swallowtail-adapter-alibaba-model-studio",
  "crates/swallowtail-adapter-anthropic",
  "crates/swallowtail-adapter-antigravity",
  "crates/swallowtail-adapter-bedrock",
  "crates/swallowtail-adapter-claude-agent",
  "crates/swallowtail-adapter-cline",
  "crates/swallowtail-adapter-codex",
  "crates/swallowtail-adapter-command-code",
  "crates/swallowtail-adapter-copilot-cli",
  "crates/swallowtail-adapter-cursor",
  "crates/swallowtail-adapter-deepagents",
  "crates/swallowtail-adapter-deepseek",
  "crates/swallowtail-adapter-deepseek-harness",
  "crates/swallowtail-adapter-gemini",
  "crates/swallowtail-adapter-goose",
  "crates/swallowtail-adapter-grok",
  "crates/swallowtail-adapter-kimi",
  "crates/swallowtail-adapter-kimi-platform",
  "crates/swallowtail-adapter-kiro",
  "crates/swallowtail-adapter-llama-cpp",
  "crates/swallowtail-adapter-mistral-vibe",
  "crates/swallowtail-adapter-muse",
  "crates/swallowtail-adapter-opencode",
  "crates/swallowtail-adapter-ollama",
  "crates/swallowtail-adapter-oh-my-pi",
  "crates/swallowtail-adapter-pi",
  "crates/swallowtail-adapter-openai",
  "crates/swallowtail-adapter-qoder",
  "crates/swallowtail-adapter-qwen",
  "crates/swallowtail-adapter-xai",
  "crates/swallowtail-adapter-zcode",
  "crates/swallowtail-core",
  "crates/swallowtail-host-local",
  "crates/swallowtail-idioms",
  "crates/swallowtail-protocol-acp",
  "crates/swallowtail-protocol-openai-chat",
  "crates/swallowtail-runtime",
  "crates/swallowtail-testkit",
  "crates/swallowtail-transport-acp-remote",
  "crates/swallowtail-transport-http",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/inflatable-cookie/swallowtail"
readme = "README.md"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
swallowtail-acp-client = { path = "crates/swallowtail-acp-client", version = "0.6.0" }
swallowtail-core = { path = "crates/swallowtail-core", version = "0.6.0" }
swallowtail-host-local = { path = "crates/swallowtail-host-local", version = "0.6.0" }
swallowtail-idioms = { path = "crates/swallowtail-idioms", version = "0.6.0" }
swallowtail-protocol-acp = { path = "crates/swallowtail-protocol-acp", version = "0.6.0" }
swallowtail-protocol-openai-chat = { path = "crates/swallowtail-protocol-openai-chat", version = "0.6.0" }
swallowtail-runtime = { path = "crates/swallowtail-runtime", version = "0.6.0" }
swallowtail-testkit = { path = "crates/swallowtail-testkit", version = "0.6.0" }
swallowtail-transport-acp-remote = { path = "crates/swallowtail-transport-acp-remote", version = "0.6.0" }
swallowtail-transport-http = { path = "crates/swallowtail-transport-http", version = "0.6.0" }

# Shared external crates carry one version requirement here and are inherited
# with `workspace = true`, so no crate manifest can drift from another.
base64 = "0.22"
curl = "0.4.50"
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
semver = "1"
serde_json = "1"
sha2 = "0.10"
# Tokio keeps its default feature set: it is empty in every 1.x release, so the
# adapters that previously spelled `default-features = false` resolve to the
# same features while Bedrock keeps the defaults its own declaration inherited.
tokio = { version = "1.52" }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.test]
debug = 0

# Checked custody hashes complete Node/native files. Keep the existing SHA-256
# implementation optimized in bounded development and test probes as well.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
