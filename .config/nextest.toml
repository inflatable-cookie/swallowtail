[profile.default]
final-status-level = "fail"
status-level = "fail"

# Keep process-spawning binaries out of the count-partitioned shards. They run
# once in the dedicated CI process shard below, so every test remains covered
# exactly once on pull requests.
#
# The `ci-process` binaries all live in swallowtail-adapter-claude-agent,
# swallowtail-adapter-pi, and swallowtail-host-local, and the macOS job in
# .github/workflows/ci.yml selects exactly those three packages so it does not
# link the whole workspace. Adding a binary here from another package means
# adding that package there too, or the binary runs nowhere.
#
# Terminate after two 60s slow periods so a hang fails with the test name
# instead of running to the GitHub job limit. A healthy ci-process run is
# about 52s wall clock for 329 tests; fixture hang guards are failure
# oracles and passing tests do not rely on them. The nextest jobs in
# .github/workflows/ci.yml also set timeout-minutes as a backstop.
[profile.ci]
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 2 }
default-filter = "not (binary(claude_agent_sdk_sidecar_asset) | binary(claude_agent_sdk_driver) | binary(sidecar_driver) | binary(claude_code_structured_run) | binary(local_process) | binary(watcher_service))"

[profile.ci-process]
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 2 }
default-filter = "binary(claude_agent_sdk_sidecar_asset) | binary(claude_agent_sdk_driver) | binary(sidecar_driver) | binary(claude_code_structured_run) | binary(local_process) | binary(watcher_service)"

# Narrow provider-free Claude SDK usage projection proofs. Reuse the process
# fixture timeout and forced termination, while allowing the decoder unit-test
# binary selected by this focused task.
[profile.sdk-usage]
inherits = "ci-process"
default-filter = "all()"

# Provider-free Codex currentness evidence, with the same bounded test lifetime.
[profile.current-codex-app-server]
inherits = "ci-process"
default-filter = "all()"

# Pi SDK sidecar identity and lifecycle regression proof. Keep the process
# fixture timeout while allowing the focused task to select sidecar_driver.
[profile.current-pi-sdk-sidecar]
inherits = "ci-process"
default-filter = "all()"
