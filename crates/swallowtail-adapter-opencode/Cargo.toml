[package]
name = "swallowtail-adapter-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "OpenCode harness drivers for Swallowtail"
autotests = false

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
base64.workspace = true
curl.workspace = true
futures-channel.workspace = true
futures-core.workspace = true
semver.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true
url.workspace = true

[dev-dependencies]
futures-executor.workspace = true
futures-util.workspace = true
sha2.workspace = true
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

