[manifest]
include = ["config/release.toml"]

[catalog]
alias = "swallowtail"

[docs_policy.indexes.research]
file = "docs/research/README.md"
dir = "docs/research"
section = "Research Records"

[tasks]
"qa:docs:links" = "python3 scripts/check-docs-links.py"
"qa:docs:index:research" = "effigy docs check index --policy-index research"
"qa:docs:research:numbers" = "python3 scripts/check-research-number-collision.py"
"qa:docs:research:numbers:test" = "bash scripts/tests/research-number-collision.sh"
"qa:docs:release-version:test" = "bash scripts/tests/release-version-identity.sh"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"hooks:install" = "bash scripts/install-git-hooks.sh"
"qa:guides" = "python3 scripts/check-integration-guide-coverage.py"
"qa:consumer-docs" = "python3 scripts/check-consumer-front-door.py"
"qa:code:version-expects" = "python3 scripts/check-literal-version-expects.py"

"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:index:research" },
  { task = "qa:docs:research:numbers" },
  { task = "qa:docs:research:numbers:test" },
  { task = "qa:docs:release-version:test" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:spine" },
  { task = "qa:docs:agent-contract" },
  { task = "qa:docs:readme" },
  { task = "qa:docs:front-door" },
  { task = "qa:docs:retired" },
  { task = "qa:consumer-docs" },
  { task = "qa:guides" },
  { task = "qa:code:version-expects" },
]

"qa:docs:retired" = "effigy skill run northstar-lean/retired-concepts"
"qa:docs:spine" = "effigy docs check paths README.md AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md PAPERCUTS.md docs/README.md docs/plan.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/questions.md docs/knowledge/retired.toml docs/knowledge/contracts/release.md docs/knowledge/contracts/writing-style.md docs/triage/README.md"
"qa:docs:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/plan.md'"
"qa:docs:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:docs:front-door" = "effigy docs check contains docs/README.md --require 'knowledge/README.md' --require 'plan.md'"

"format:check" = "cargo fmt --all -- --check"
"check:rust" = "cargo check --workspace --all-targets"
"check:examples" = "cargo check --workspace --examples --locked"
"lint:rust" = "cargo clippy --workspace --all-targets -- -D warnings"
"test:rust" = "cargo nextest run"
"validate:focused" = "bash scripts/validate-focused-packages.sh {args}"
"validate:card116-mediated-stdio" = "cargo test -p swallowtail-host-local --features mediated-stdio-proxy --test registered_tool_proxy"
"validate:selectors:test" = "bash scripts/tests/validation-selectors.sh"
"qa:routes" = "bash scripts/check-provider-route-matrix.sh"
"probe:gemini-installed" = "cargo test -p swallowtail-adapter-gemini --features live-probes --test live_installed_probe -- --ignored --exact gemini_cli_is_installed_when_live_probe_is_enabled"
"probe:grok-installed" = "SWALLOWTAIL_LIVE_GROK=1 cargo test -p swallowtail-adapter-grok --features live-probes --test live_installed_probe -- --ignored --exact installed_grok_build_is_exactly_classified"
"probe:opencode-installed" = "cargo test -p swallowtail-adapter-opencode --features live-probes --test installed_probe -- --ignored --exact installed_opencode_health_and_schema_match_the_frozen_subset"
"probe:kimi-installed" = "cargo test -p swallowtail-adapter-kimi --features live-probes --test live_installed_probe -- --ignored --exact pinned_kimi_code_cli_is_installed_when_live_probe_is_enabled"
"probe:muse-installed" = "SWALLOWTAIL_LIVE_MUSE=1 cargo test -p swallowtail-adapter-muse --features live-probes --test live_installed_probe -- --ignored --exact installed_muse_payload_is_exactly_classified"
"probe:muse-spark-low" = "cargo test -p swallowtail-adapter-muse --features live-probes --test live_installed_probe -- --ignored --exact configured_muse_completes_spark_low_through_the_prepared_facade"
"probe:command-code-installed" = "SWALLOWTAIL_LIVE_COMMAND_CODE=1 cargo test -p swallowtail-adapter-command-code --features live-probes --test live_installed_probe -- --ignored --exact installed_command_code_payload_is_exactly_classified"
"probe:command-code-plan" = "SWALLOWTAIL_LIVE_COMMAND_CODE_PROMPT=1 cargo test -p swallowtail-adapter-command-code --features live-probes --test live_installed_probe -- --ignored --exact configured_command_code_completes_one_turn_through_the_prepared_facade"
"probe:command-code-interactive" = "SWALLOWTAIL_LIVE_COMMAND_CODE_PROMPT=1 cargo test -p swallowtail-adapter-command-code --features live-probes --test live_installed_probe -- --ignored --exact configured_command_code_completes_two_interactive_turns_with_exact_resume"
"probe:deepseek-harness-installed" = "SWALLOWTAIL_LIVE_DEEPSEEK_HARNESS=1 cargo test -p swallowtail-adapter-deepseek-harness --features live-probes --test live_installed_probe -- --ignored --exact installed_deepseek_harness_is_exactly_classified"
"probe:deepseek-harness-live" = "SWALLOWTAIL_LIVE_DEEPSEEK_HARNESS_PROMPT=1 cargo test -p swallowtail-adapter-deepseek-harness --features live-probes --test live_installed_probe -- --ignored --exact configured_deepseek_harness_completes_one_prompt_through_prepared_facade"
"probe:deepseek-harness-web-installed" = "SWALLOWTAIL_LIVE_DEEPSEEK_HARNESS_WEB=1 cargo test -p swallowtail-adapter-deepseek-harness --features live-probes --test live_installed_probe -- --ignored --exact installed_deepseek_harness_web_is_exactly_classified"
"probe:deepseek-harness-web-live" = "SWALLOWTAIL_LIVE_DEEPSEEK_HARNESS_WEB_PROMPT=1 cargo test -p swallowtail-adapter-deepseek-harness --features live-probes --test live_installed_probe -- --ignored --exact configured_deepseek_harness_web_completes_one_prompt_through_prepared_facade"
"probe:zcode-installed" = "SWALLOWTAIL_LIVE_ZCODE=1 cargo test -p swallowtail-adapter-zcode --features live-probes --test live_installed_probe -- --ignored --exact installed_zcode_app_server_is_exactly_classified"
"probe:zcode-live" = "SWALLOWTAIL_LIVE_ZCODE_PROMPT=1 cargo test -p swallowtail-adapter-zcode --features live-probes --test live_installed_probe -- --ignored --exact configured_zcode_app_server_completes_one_prompt_through_prepared_facade"
"probe:qwen-installed" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact installed_qwen_code_is_exactly_classified"
"probe:qwen-catalogue" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact configured_qwen_code_returns_a_bounded_model_catalogue"
"probe:qwen-read-only" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact configured_qwen_code_completes_one_bounded_read_only_prompt"
"probe:pi-installed" = "SWALLOWTAIL_LIVE_PI=1 cargo test -p swallowtail-adapter-pi --features live-probes --test live_installed_probe -- --ignored --exact installed_pi_is_exactly_classified"
"probe:ollama-installed" = "cargo test -p swallowtail-adapter-ollama --features live-probes --test installed_probe -- --ignored --exact installed_runtime_exposes_qualified_version_and_local_catalogue"
"probe:omp-installed" = "SWALLOWTAIL_LIVE_OMP=1 cargo test -p swallowtail-adapter-oh-my-pi --features live-probes --test live_installed_probe -- --ignored --exact installed_omp_is_exactly_classified"
"probe:omp-luna-low" = "cargo test -p swallowtail-adapter-oh-my-pi --features live-probes --test live_installed_probe -- --ignored --exact configured_omp_completes_luna_low_through_the_prepared_facade"
"bootstrap:claude-agent-acp" = "npm ci --ignore-scripts"
"probe:claude-agent-acp-managed" = "./node_modules/.bin/claude-agent-acp --version"
"probe:claude-code-response-only" = "SWALLOWTAIL_LIVE_CLAUDE_CODE_RESPONSE_ONLY=1 cargo test -p swallowtail-adapter-claude-agent --features live-probes --test live_response_only_probe -- --ignored --exact configured_claude_code_returns_one_tool_free_text_response"
"probe:claude-code-watcher-live" = "SWALLOWTAIL_LIVE_CLAUDE_CODE_WATCHER=1 cargo test -p swallowtail-adapter-claude-agent --features live-probes --test live_watcher_probe -- --ignored --exact configured_claude_code_blocks_early_completion_then_joins_one_watcher"

"package:metadata" = "bash scripts/check-package-metadata.sh"
"package:api" = "bash scripts/check-public-api.sh"
"security:dependencies" = "cargo deny check advisories licenses sources"
"package:verify-affected" = "bash scripts/verify-affected-packages.sh {args}"
"package:docs" = "RUSTDOCFLAGS='-D missing_docs' cargo doc --workspace --all-features --no-deps --locked"
"package:msrv" = "bash scripts/check-msrv.sh"
"package:release-floor" = "bash scripts/check-release-floor.sh"
"package:source-consumer" = "bash scripts/verify-source-consumer.sh"
"package:check" = [
  { task = "package:metadata" },
  { task = "package:api" },
  { task = "package:docs" },
  { task = "package:msrv" },
  { task = "package:release-floor" },
  { task = "security:dependencies" },
  { task = "package:source-consumer" },
  { task = "qa" },
]

"qa" = [
  { task = "qa:docs" },
  { task = "qa:routes" },
  { task = "format:check" },
  { task = "lint:rust" },
  { task = "test:rust" },
]

# Cheap orientation for `effigy doctor`. Full board is `effigy qa`.
# Never alias health to qa.
"health" = [
  { task = "hooks:install" },
  { task = "qa:docs:agent-defaults" },
  { task = "format:check" },
]

[bootstrap]
run = [
  { task = "hooks:install" },
]
