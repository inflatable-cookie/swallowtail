[package]
name = "swallowtail-adapter-claude-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Claude Agent ACP and Claude Code headless harness drivers for Swallowtail"
autotests = false

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
futures-channel.workspace = true
futures-core.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
swallowtail-acp-client.workspace = true
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true
url.workspace = true

[dev-dependencies]
async-tungstenite.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
hex.workspace = true
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true
swallowtail-transport-acp-remote.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "acp_guard_capture"
path = "tests/acp_guard_capture.rs"

[[test]]
name = "claude_agent_sdk_driver"
path = "tests/claude_agent_sdk_driver.rs"

[[test]]
name = "claude_agent_sdk_sidecar_asset"
path = "tests/claude_agent_sdk_sidecar_asset.rs"

[[test]]
name = "claude_code_structured_run"
path = "tests/claude_code_structured_run.rs"

[[example]]
name = "sdk240-trusted-prepared"
path = "examples/sdk240_trusted_prepared.rs"
