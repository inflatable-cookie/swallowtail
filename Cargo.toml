[workspace]
members = [
  "crates/swallowtail-adapter-alibaba-model-studio",
  "crates/swallowtail-adapter-anthropic",
  "crates/swallowtail-adapter-antigravity",
  "crates/swallowtail-adapter-bedrock",
  "crates/swallowtail-adapter-claude-agent",
  "crates/swallowtail-adapter-codex",
  "crates/swallowtail-adapter-cursor",
  "crates/swallowtail-adapter-deepseek",
  "crates/swallowtail-adapter-gemini",
  "crates/swallowtail-adapter-grok",
  "crates/swallowtail-adapter-kimi",
  "crates/swallowtail-adapter-kimi-platform",
  "crates/swallowtail-adapter-llama-cpp",
  "crates/swallowtail-adapter-opencode",
  "crates/swallowtail-adapter-ollama",
  "crates/swallowtail-adapter-oh-my-pi",
  "crates/swallowtail-adapter-pi",
  "crates/swallowtail-adapter-openai",
  "crates/swallowtail-adapter-qwen",
  "crates/swallowtail-adapter-xai",
  "crates/swallowtail-core",
  "crates/swallowtail-host-local",
  "crates/swallowtail-protocol-acp",
  "crates/swallowtail-protocol-openai-chat",
  "crates/swallowtail-runtime",
  "crates/swallowtail-testkit",
  "crates/swallowtail-transport-acp-remote",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/inflatable-cookie/swallowtail"
readme = "README.md"
publish = false
rust-version = "1.90"

[workspace.dependencies]
swallowtail-core = { path = "crates/swallowtail-core", version = "0.1.0" }
swallowtail-host-local = { path = "crates/swallowtail-host-local", version = "0.1.0" }
swallowtail-protocol-acp = { path = "crates/swallowtail-protocol-acp", version = "0.1.0" }
swallowtail-protocol-openai-chat = { path = "crates/swallowtail-protocol-openai-chat", version = "0.1.0" }
swallowtail-runtime = { path = "crates/swallowtail-runtime", version = "0.1.0" }
swallowtail-testkit = { path = "crates/swallowtail-testkit", version = "0.1.0" }
swallowtail-transport-acp-remote = { path = "crates/swallowtail-transport-acp-remote", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.test]
debug = 0
