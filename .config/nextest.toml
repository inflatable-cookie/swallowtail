[profile.default]
final-status-level = "fail"
status-level = "fail"

# Keep process-spawning binaries out of the count-partitioned shards. They run
# once in the dedicated CI process shard below, so every test remains covered
# exactly once on pull requests.
#
# The `ci-process` binaries all live in swallowtail-adapter-claude-agent,
# swallowtail-adapter-pi, and swallowtail-host-local. The process-spawning job
# in .github/workflows/ci.yml runs on Linux and macOS and selects exactly those
# three packages so it does not link the whole workspace. Adding a binary here
# from another package means adding that package there too, or the binary runs
# nowhere.
#
# Every other test in a package is a module of that package's single
# `tests/integration` binary, declared in `tests/integration/main.rs`. A new
# test file becomes a module there rather than a new `[[test]]` target, so the
# workspace keeps one integration binary per package.
#
# Terminate after two 60s slow periods so a hang fails with the test name
# instead of running to the GitHub job limit. A healthy ci-process run is
# about 75s wall clock for 375 tests; fixture hang guards are failure
# oracles and passing tests do not rely on them. The nextest jobs in
# .github/workflows/ci.yml also set timeout-minutes as a backstop.
[profile.ci]
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 2 }
default-filter = "not (binary(acp_guard_capture) | binary(claude_agent_sdk_sidecar_asset) | binary(claude_agent_sdk_driver) | binary(sidecar_driver) | binary(claude_code_structured_run) | binary(local_process) | binary(watcher_service))"

[profile.ci-process]
inherits = "default"
slow-timeout = { period = "60s", terminate-after = 2 }
default-filter = "binary(acp_guard_capture) | binary(claude_agent_sdk_sidecar_asset) | binary(claude_agent_sdk_driver) | binary(sidecar_driver) | binary(claude_code_structured_run) | binary(local_process) | binary(watcher_service)"

# The one unfiltered process profile: the same fixture timeout and forced
# termination as ci-process, with every binary of the selected packages
# selectable. Focused validation selectors in effigy.toml pass it directly.
[profile.process-unfiltered]
inherits = "ci-process"
default-filter = "all()"
