[package]
name = "swallowtail-transport-acp-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Remote ACP HTTP/SSE and WebSocket client transport for Swallowtail"

[dependencies]
agent-client-protocol = "=2.0.0"
async-tungstenite = { version = "=0.34.1", default-features = false, features = ["tokio-rustls-webpki-roots"] }
cookie_store = { version = "=0.22.1", default-features = false }
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true
tokio = { version = "1.52", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
url = "2.5"

[dev-dependencies]
agent-client-protocol-http = { version = "=2.0.0", features = ["server"] }
axum = "0.8"
bytes = "1"
futures-executor = "0.3"
h2 = "0.4"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
swallowtail-testkit.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
