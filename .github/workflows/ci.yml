name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  stable-format-and-lint:
    name: Stable format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  stable-nextest:
    name: Stable nextest (shard ${{ matrix.shard }}/3)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: Node runtime for the Claude Agent SDK sidecar asset proof
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Test
        run: cargo nextest run --workspace --all-features --locked --profile ci --partition count:${{ matrix.shard }}/3

  stable-process-nextest:
    name: Stable process-spawning nextest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: Node runtime for the Claude Agent SDK sidecar asset proof
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Process-spawning tests
        run: cargo nextest run --workspace --all-features --locked --profile ci-process

  stable-contracts:
    name: Stable examples, metadata, and route contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - name: Examples
        run: cargo check --workspace --examples --locked
      - name: Package metadata and topology
        run: bash scripts/check-package-metadata.sh
      - name: Route and guide contracts
        run: |
          bash scripts/check-provider-route-matrix.sh
          python3 scripts/check-integration-guide-coverage.py
          python3 scripts/check-consumer-front-door.py
          python3 scripts/check-literal-version-expects.py

  docs-and-api:
    name: Documentation and semantic API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-05
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: Deny missing public documentation
        run: RUSTDOCFLAGS='-D missing_docs' cargo doc --workspace --all-features --no-deps --locked
      - name: Semantic public API baseline
        run: bash scripts/check-public-api.sh

  roadmap-numbers:
    name: Roadmap number uniqueness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collision check against canonical main
        run: python3 scripts/check-roadmap-number-collision.py
      - name: Collision mutation suite
        run: bash scripts/tests/roadmap-number-collision.sh

  rust-floor:
    name: Pinned MSRV floor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned MSRV from baseline
        run: |
          source release-baselines/rust-toolchains-0.2.0.env
          echo "RUST_MSRV=$SWALLOWTAIL_MSRV" >> "$GITHUB_ENV"
          rustup toolchain install "$SWALLOWTAIL_MSRV" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ env.RUST_MSRV }}
      - name: Node runtime for the Claude Agent SDK sidecar asset proof
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Clippy
        run: cargo +${{ env.RUST_MSRV }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: cargo +${{ env.RUST_MSRV }} test --workspace --all-features --locked

  supply-chain:
    name: Dependency security, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses sources

  external-source:
    name: External Git-source consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/verify-source-consumer.sh
