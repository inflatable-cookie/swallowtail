[package]
name = "swallowtail-adapter-bedrock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version = "1.94.1"
description = "Amazon Bedrock SDK-native direct-inference drivers for Swallowtail"

[lib]
doctest = false

[dependencies]
aws-credential-types = "1.3.0"
aws-sdk-bedrock = { version = "=1.148.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
aws-sdk-bedrockruntime = { version = "=1.136.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
futures-channel = { version = "0.3", features = ["sink"] }
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
futures-executor = "0.3"
serde_json = "1"
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true
