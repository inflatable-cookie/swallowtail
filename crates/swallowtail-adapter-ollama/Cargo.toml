[package]
name = "swallowtail-adapter-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Ollama native attached-runtime adapter for Swallowtail"

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
curl.workspace = true
futures-channel.workspace = true
futures-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
url.workspace = true

[dev-dependencies]
futures-executor.workspace = true
futures-util.workspace = true
sha2.workspace = true
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "installed_probe"
path = "tests/installed_probe.rs"
required-features = ["live-probes"]
