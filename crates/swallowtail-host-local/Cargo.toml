[package]
name = "swallowtail-host-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Host-approved local execution services for Swallowtail"

[lib]
doctest = false

[dependencies]
futures-executor = "0.3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal"] }

[lints]
workspace = true
