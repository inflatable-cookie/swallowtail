[package]
name = "swallowtail-adapter-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "OpenAI public-API drivers for Swallowtail"
autotests = false

[lib]
doctest = false

[dependencies]
base64 = "0.22"
curl = "0.4.50"
futures-channel = "0.3"
futures-core = "0.3"
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
url = "2"
zeroize = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "catalogue_activity"
path = "tests/catalogue_suite.rs"

[[test]]
name = "prepared_facade"
path = "tests/direct_suite.rs"

[[test]]
name = "realtime_prepared_facade"
path = "tests/realtime_suite.rs"
