[package]
name = "swallowtail-adapter-claude-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Claude Agent ACP and Claude Code headless harness drivers for Swallowtail"

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
semver = "1"
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true

[dev-dependencies]
async-tungstenite = { version = "=0.34.1", default-features = false, features = ["tokio-rustls-webpki-roots"] }
futures-util = "0.3"
swallowtail-testkit.workspace = true
swallowtail-transport-acp-remote.workspace = true
swallowtail-host-local.workspace = true
tokio = { version = "1.52", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true

[[test]]
name = "live_response_only_probe"
path = "tests/live_response_only_probe.rs"
required-features = ["live-probes"]

[[test]]
name = "live_watcher_probe"
path = "tests/live_watcher_probe.rs"
required-features = ["live-probes"]
