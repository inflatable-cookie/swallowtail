[package]
name = "swallowtail-adapter-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "OpenCode harness drivers for Swallowtail"
autotests = false

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
base64 = "0.22"
curl = "0.4.50"
futures-channel = "0.3"
futures-core = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
url = "2"

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "installed_probe"
path = "tests/installed_probe.rs"
required-features = ["live-probes"]

[[test]]
name = "prepared_facade"
path = "tests/runtime_suite.rs"

[[test]]
name = "protocol_fixtures"
path = "tests/protocol_suite.rs"
