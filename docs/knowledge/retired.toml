# Concepts that no longer exist. The retired-concepts check fails on any listed
# term, path or config key found outside `allow`. It is not part of repository
# QA; run it from the repository root before merging a change that touches
# docs: `effigy skill run northstar/retired-concepts`.
#
# paths and allow: an entry is an exact file, or a directory when it ends in
# "/". `*` matches within one path segment. Keep terms multi-word and specific.

# Frozen artefacts are never rewritten and are exempt from every retirement
# and from check-links: test fixtures, immutable release baselines and
# candidates, and research records (evidence the feature matrix cites by line).
frozen = [
  "crates/*/tests/fixtures/",
  "crates/*/fixtures/",
  "release-candidates/",
  "release-baselines/",
  "docs/research/",
]

[[retired]]
id = "northstar-process-records"
retired = "2026-09-26"
replacement = "Knowledge in docs/knowledge/; the plan, tasks, briefs, status and outcomes live in Queue."
owner = "docs/knowledge/README.md"
terms = ["roadmap card", "generation index", "northstar:lifecycle", "chatterbox handoff", "Next Task pointer", "northstar/queue:hook", "standing-lanes.md", "status-grammar.md", "qa:northstar", "qa:docs:roadmaps", "generation runway"]
paths = [".northstar/", "docs/roadmaps/", "docs/handoffs/", "docs/logs/", "docs/vision/", "docs/policy/", "docs/guides/release-playbook.md", "docs/guides/version-currentness-checkpoint.md", "scripts/check-roadmap-number-collision.py", "scripts/check-roadmap-status-drift.py", "scripts/roadmap_number_authority.py"]
config_keys = ["northstar/queue:hook", "paseo.queue.control.v4"]
# Released changelog entries name old records as history.
allow = ["CHANGELOG.md", "docs/knowledge/retired.toml"]

[[retired]]
id = "papercuts-file"
retired = "2026-09-26"
replacement = "Papercuts live in Queue: file with `node bin/queue-cli.mjs papercut.add` from the Queue plugin root; the planner promotes or closes them."
owner = "AGENTS.md"
