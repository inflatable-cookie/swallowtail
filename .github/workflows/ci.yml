name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# The root rust-toolchain.toml selects the Rust toolchain (and its rustfmt and
# clippy components) for every bare cargo command in the checkout, so jobs do
# not install a stable toolchain that would go unused. Jobs that need another
# toolchain name it explicitly: nightly-2026-08-05 for docs and the public API
# baseline, and the MSRV floor from release-baselines.
jobs:
  stable-format-and-lint:
    name: Stable format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: stable
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  stable-nextest:
    name: Stable nextest (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: nextest
          cache-on-failure: true
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2 (v2.90.7)
        with:
          tool: cargo-nextest@0.9.145
      - name: Test
        run: cargo nextest run --workspace --all-features --locked --profile ci --partition count:${{ matrix.shard }}/2

  stable-process-nextest:
    name: Stable process-spawning nextest (${{ matrix.os }})
    # Both platforms run on pull requests, so the seven process-spawning test
    # binaries are not macOS-only. macos-15 is standard arm64; latest repeatedly
    # failed hosted acquisition before checkout.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: nextest
          cache-on-failure: true
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2 (v2.90.7)
        with:
          tool: cargo-nextest@0.9.145
      - name: Node runtime for the Claude Agent SDK sidecar asset proof
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Build process-spawning test archive
        # The test binaries build in the workspace target that Swatinem/rust-cache
        # restores and saves. The archive lets the run step use them without a
        # second outer build in a different target directory.
        run: |
          cargo nextest archive \
            -p swallowtail-adapter-claude-agent \
            -p swallowtail-adapter-pi \
            -p swallowtail-host-local \
            --all-features --locked \
            --archive-file "$RUNNER_TEMP/process-tests.tar.zst"
      - name: Process-spawning tests
        # The courier-backed tests build the registered-tool courier inside the
        # test process and refuse any target the validation runner does not own.
        # The wrapper gives only that nested build one fresh target for this
        # step, then removes it; the archived test binaries are not rebuilt.
        run: |
          bash scripts/run-with-owned-cargo-target.sh cargo nextest run \
            --archive-file "$RUNNER_TEMP/process-tests.tar.zst" \
            --profile ci-process

  stable-contracts:
    name: Stable examples, metadata, and route contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: stable
          cache-on-failure: true
      - name: Examples
        run: cargo check --workspace --examples --locked
      - name: Package metadata and topology
        run: bash scripts/check-package-metadata.sh
      - name: Route and guide contracts
        run: |
          bash scripts/check-provider-route-matrix.sh
          python3 scripts/check-integration-guide-coverage.py
          python3 scripts/check-consumer-front-door.py
          python3 scripts/check-literal-version-expects.py --self-test
          python3 scripts/check-literal-version-expects.py
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2 (v2.90.7)
        with:
          tool: ripgrep@15.2.0
      - name: Ephemeral pinned Effigy for docs link gate
        shell: bash
        run: |
          set -euo pipefail
          tools=$(mktemp -d "$RUNNER_TEMP/effigy-tools.XXXXXXXX")
          asset=effigy-x86_64-unknown-linux-gnu
          digest=18c6e6b1626cdeafa05c97547d9da6c177825592814f837c9119980f9aa1fc34
          curl --fail --location --max-time 60 --max-filesize 67108864 "https://github.com/inflatable-cookie/effigy/releases/download/v0.14.1/$asset" -o "$tools/effigy"
          test "$(shasum -a 256 "$tools/effigy" | cut -d' ' -f1)" = "$digest"
          chmod 700 "$tools/effigy"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Docs links and selector gate tests
        run: |
          python3 scripts/check-docs-links.py
          effigy qa:docs:index:research
          effigy qa:docs:agent-defaults
          effigy qa:docs:spine
          effigy qa:docs:agent-contract
          effigy qa:docs:readme
          effigy qa:docs:front-door
          python3 scripts/tests/oxide-selector-routing.py
          bash scripts/tests/oxide-rust-routing.sh
          bash scripts/tests/release-version-identity.sh
          bash scripts/tests/validation-selectors.sh
          bash scripts/tests/format-selectors.sh

  docs-and-api:
    name: Documentation and semantic API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly-2026-08-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: docs-api
          cache-on-failure: true
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2 (v2.90.7)
        with:
          tool: cargo-public-api@0.52.0
      - name: Deny missing public documentation
        run: RUSTDOCFLAGS='-D missing_docs' cargo +nightly-2026-08-05 doc --workspace --all-features --no-deps --locked
      - name: Semantic public API baseline
        run: bash scripts/check-public-api.sh

  research-numbers:
    name: Research number uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collision check against canonical main
        run: python3 scripts/check-research-number-collision.py
      - name: Collision mutation suite
        run: bash scripts/tests/research-number-collision.sh

  rust-floor:
    name: Pinned MSRV floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned MSRV from baseline
        run: |
          source release-baselines/rust-toolchains-0.7.0.env
          echo "RUST_MSRV=$SWALLOWTAIL_MSRV" >> "$GITHUB_ENV"
          rustup toolchain install "$SWALLOWTAIL_MSRV" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust-${{ env.RUST_MSRV }}
          cache-on-failure: true
      - name: Clippy
        run: cargo +${{ env.RUST_MSRV }} clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-floor-test:
    name: Pinned MSRV floor tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned MSRV from baseline
        run: |
          source release-baselines/rust-toolchains-0.7.0.env
          echo "RUST_MSRV=$SWALLOWTAIL_MSRV" >> "$GITHUB_ENV"
          rustup toolchain install "$SWALLOWTAIL_MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust-${{ env.RUST_MSRV }}
          cache-on-failure: true
      - name: Node runtime for the Claude Agent SDK sidecar asset proof
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Test
        run: bash scripts/run-with-owned-cargo-target.sh cargo +${{ env.RUST_MSRV }} test --workspace --all-features --locked

  supply-chain:
    name: Dependency security, licenses, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false
          cache-on-failure: true
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2 (v2.90.7)
        with:
          tool: cargo-deny@0.19.4
      - run: |
          python3 -B scripts/check-chrono-maintenance.py --self-test
          python3 -B scripts/check-chrono-maintenance.py
          cargo deny check advisories licenses sources

  external-source:
    name: External Git-source consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: bash scripts/verify-source-consumer.sh
