[package]
name = "swallowtail-host-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Host-approved local execution services for Swallowtail"
autotests = false

[lib]
doctest = false

[features]
mediated-stdio-proxy = []

[dependencies]
async-io = "2"
futures-executor.workspace = true
futures-lite = "2"
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
zeroize.workspace = true

[dev-dependencies]
swallowtail-testkit.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal", "user"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "local_process"
path = "tests/local_process.rs"

[[test]]
name = "watcher_service"
path = "tests/watcher_service.rs"

[[bin]]
name = "swallowtail-registered-tool-courier"
path = "src/bin/registered_tool_courier.rs"
required-features = ["mediated-stdio-proxy"]
