[manifest]
include = ["config/release.toml"]

[catalog]
alias = "swallowtail"

[docs_policy.indexes.research]
file = "docs/research/README.md"
dir = "docs/research"
section = "Research Records"

[tasks]
"qa:docs:links" = "python3 scripts/check-docs-links.py"
"qa:docs:index:research" = "effigy docs check index --policy-index research"
"qa:docs:research:numbers" = "python3 scripts/check-research-number-collision.py"
"qa:docs:research:numbers:test" = "bash scripts/tests/research-number-collision.sh"
"qa:docs:research:numbers:compile" = "python3 -c 'from pathlib import Path; files = (Path(\"scripts/check-research-number-collision.py\"), Path(\"scripts/canonical_main_authority.py\")); [compile(file.read_bytes(), str(file), \"exec\") for file in files]'"
"qa:docs:release-version:test" = "bash scripts/tests/release-version-identity.sh"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"hooks:install" = "bash scripts/install-git-hooks.sh"
"qa:guides" = "python3 scripts/check-integration-guide-coverage.py"
"qa:consumer-docs" = "python3 scripts/check-consumer-front-door.py"
"qa:code:version-expects" = "python3 scripts/check-literal-version-expects.py"

"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:index:research" },
  { task = "qa:docs:research:numbers" },
  { task = "qa:docs:research:numbers:test" },
  { task = "qa:docs:release-version:test" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:spine" },
  { task = "qa:docs:agent-contract" },
  { task = "qa:docs:readme" },
  { task = "qa:docs:front-door" },
  { task = "qa:consumer-docs" },
  { task = "qa:guides" },
  { task = "qa:code:version-expects" },
]

"qa:docs:spine" = "effigy docs check paths README.md AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md docs/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/questions.md docs/knowledge/retired.toml docs/knowledge/contracts/release.md docs/knowledge/contracts/writing-style.md"
"qa:docs:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'plan.get'"
"qa:docs:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:docs:front-door" = "effigy docs check contains docs/README.md --require 'knowledge/README.md' --require 'Queue'"

"format:check" = "cargo fmt --all -- --check"
"check:rust" = "cargo check --workspace --all-targets"
"check:sdk-usage-projection" = "cargo check --locked -p swallowtail-adapter-claude-agent --all-targets"
"format:current-claude-agent-acp" = [
  "cargo fmt -p swallowtail-adapter-claude-agent",
  "cargo fmt -p swallowtail-adapter-claude-agent -- --check",
]
"check:current-claude-agent-acp" = "cargo check --locked --all-targets -p swallowtail-adapter-claude-agent"
"validate:current-claude-agent-acp" = "cargo nextest run --locked --profile ci -p swallowtail-adapter-claude-agent --lib --test integration -E 'test(/identity_and_claim_qualify_current_0_87_0_with_exact_hop_evidence|historical_0_81_2_identity_remains_qualified_after_0_87_0|production_claim_keeps_the_frozen_corpus_inside_the_raised_window|every_qualified_claude_segment_has_exact_activity_provenance|qualified_milestones_and_unverified_newer_use_one_exact_read_only_session_shape|qualified_versions_load_ordered_replay_and_resume_without_replay|qualified_native_close_ends_active_work_without_deleting_history|one_prompt_run_preserves_version_topology_retention_and_native_close|permission_stops_as_provider_request_without_auto_approval_or_callback|cancellation_stops_the_turn_then_joins_the_clean_operation_cleanup|operation_deadline_times_out_the_turn_then_joins_a_clean_session_cleanup|exact_wrapper_versions_probe_only_the_host_approved_target|qualified_behavior_segments_share_one_delete_and_cleanup_contract|unverified_newer_delete_requires_explicit_acceptance_and_close_is_not_promoted|tool_title_refines_and_survives_payload_only_completion/)'"
