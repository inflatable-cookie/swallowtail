serde_json.workspace = true
sha2.workspace = true
swallowtail-acp-client.workspace = true
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true

[dev-dependencies]
futures-executor.workspace = true
futures-util.workspace = true
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[example]]
name = "grok-acp-client-mcp-probe"
required-features = ["live-probes"]

[[example]]
name = "grok-acp-echo-mcp"
required-features = ["live-probes"]

