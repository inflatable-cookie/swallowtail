[package]
autotests = false
name = "swallowtail-adapter-bedrock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Amazon Bedrock SDK-native direct-inference drivers for Swallowtail"

[lib]
doctest = false

[dependencies]
aws-credential-types = "1.3.0"
aws-sdk-bedrock = { version = "=1.166.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "=1.153.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
futures-channel = { workspace = true, features = ["sink"] }
futures-core.workspace = true
futures-util = { workspace = true, features = ["sink"] }
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[dev-dependencies]
aws-smithy-http-client = { version = "=1.5.2", features = ["test-util"] }
futures-executor.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
