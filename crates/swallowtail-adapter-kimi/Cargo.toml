[package]
name = "swallowtail-adapter-kimi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Kimi Code harness drivers for Swallowtail"
autotests = false

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
curl = "0.4.50"
futures-channel = "0.3"
futures-core = "0.3"
semver = "1"
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-protocol-acp.workspace = true
swallowtail-runtime.workspace = true
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "live_installed_probe"
path = "tests/live_installed_probe.rs"
required-features = ["live-probes"]

[[test]]
name = "prepared_facade"
path = "tests/acp_suite.rs"

[[test]]
name = "headless_structured_run"
path = "tests/headless_suite.rs"

[[test]]
name = "local_server_interactive"
path = "tests/local_suite.rs"

[[test]]
name = "executable_identity"
path = "tests/identity_suite.rs"
