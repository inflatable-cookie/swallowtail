[manifest]
include = ["config/release.toml"]

[catalog]
alias = "swallowtail"

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[docs_policy.indexes.roadmaps]
file = "docs/roadmaps/README.md"
dir = "docs/roadmaps"
section = "Index"
exclude = []

[docs_policy.next_actions.roadmaps]
index = "roadmaps"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"

[tasks]
"qa:docs:links" = "effigy docs check links README.md AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md docs/README.md docs/releases/README.md docs/releases/0.1.0.md docs/releases/0.1.1.md"
"qa:docs:index:vision" = "effigy docs check index --policy-index vision"
"qa:docs:next-action:roadmaps" = "effigy docs check next-action --policy roadmaps"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:guides" = "python3 scripts/check-integration-guide-coverage.py"
"qa:consumer-docs" = "python3 scripts/check-consumer-front-door.py"

"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:next-action:roadmaps" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:consumer-docs" },
  { task = "qa:guides" },
]

"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md docs/README.md docs/vision/README.md docs/architecture/README.md docs/contracts/README.md docs/specs/README.md docs/roadmaps/README.md docs/logs/README.md docs/policy/internal-writing-style.md docs/policy/vision-next-task-verbs.txt"
"qa:northstar:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md'"
"qa:northstar:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:northstar:docs-front-door" = "effigy docs check contains docs/README.md --require 'vision/README.md' --require 'architecture/README.md' --require 'contracts/README.md' --require 'roadmaps/README.md' --require 'logs/README.md'"
"qa:northstar:headings" = "effigy docs check headings docs/vision/README.md --require-heading '## Current Vision'"
"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:readme" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:headings" },
]

"format:check" = "cargo fmt --all -- --check"
"check:rust" = "cargo check --workspace --all-targets"
"check:examples" = "cargo check --workspace --examples --locked"
"lint:rust" = "cargo clippy --workspace --all-targets -- -D warnings"
"test:rust" = "cargo nextest run"
"validate:focused" = "bash scripts/validate-focused-packages.sh {args}"
"validate:selectors:test" = "bash scripts/tests/validation-selectors.sh"
"qa:routes" = "bash scripts/check-provider-route-matrix.sh"
"probe:gemini-installed" = "cargo test -p swallowtail-adapter-gemini --features live-probes --test live_installed_probe -- --ignored --exact gemini_cli_is_installed_when_live_probe_is_enabled"
"probe:grok-installed" = "SWALLOWTAIL_LIVE_GROK=1 cargo test -p swallowtail-adapter-grok --features live-probes --test live_installed_probe -- --ignored --exact installed_grok_build_is_exactly_classified"
"probe:opencode-installed" = "cargo test -p swallowtail-adapter-opencode --features live-probes --test installed_probe -- --ignored --exact installed_opencode_health_and_schema_match_the_frozen_subset"
"probe:kimi-installed" = "cargo test -p swallowtail-adapter-kimi --features live-probes --test live_installed_probe -- --ignored --exact pinned_kimi_code_cli_is_installed_when_live_probe_is_enabled"
"probe:muse-installed" = "SWALLOWTAIL_LIVE_MUSE=1 cargo test -p swallowtail-adapter-muse --features live-probes --test live_installed_probe -- --ignored --exact installed_muse_payload_is_exactly_classified"
"probe:muse-spark-low" = "cargo test -p swallowtail-adapter-muse --features live-probes --test live_installed_probe -- --ignored --exact configured_muse_completes_spark_low_through_the_prepared_facade"
"probe:qwen-installed" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact installed_qwen_code_is_exactly_classified"
"probe:qwen-catalogue" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact configured_qwen_code_returns_a_bounded_model_catalogue"
"probe:qwen-read-only" = "cargo test -p swallowtail-adapter-qwen --features live-probes --test live_installed_probe -- --ignored --exact configured_qwen_code_completes_one_bounded_read_only_prompt"
"probe:pi-installed" = "SWALLOWTAIL_LIVE_PI=1 cargo test -p swallowtail-adapter-pi --features live-probes --test live_installed_probe -- --ignored --exact installed_pi_is_exactly_classified"
"probe:ollama-installed" = "cargo test -p swallowtail-adapter-ollama --features live-probes --test installed_probe -- --ignored --exact installed_runtime_exposes_qualified_version_and_local_catalogue"
"probe:omp-installed" = "SWALLOWTAIL_LIVE_OMP=1 cargo test -p swallowtail-adapter-oh-my-pi --features live-probes --test live_installed_probe -- --ignored --exact installed_omp_is_exactly_classified"
"probe:omp-luna-low" = "cargo test -p swallowtail-adapter-oh-my-pi --features live-probes --test live_installed_probe -- --ignored --exact configured_omp_completes_luna_low_through_the_prepared_facade"
"bootstrap:claude-agent-acp" = "npm ci --ignore-scripts"
"probe:claude-agent-acp-managed" = "./node_modules/.bin/claude-agent-acp --version"

"package:metadata" = "bash scripts/check-package-metadata.sh"
"package:api" = "bash scripts/check-public-api.sh"
"security:dependencies" = "cargo deny check advisories licenses sources"
"package:verify-affected" = "bash scripts/verify-affected-packages.sh {args}"
"package:docs" = "RUSTDOCFLAGS='-D missing_docs' cargo doc --workspace --all-features --no-deps --locked"
"package:msrv" = "bash scripts/check-msrv.sh"
"package:release-floor" = "bash scripts/check-release-floor.sh"
"package:source-consumer" = "bash scripts/verify-source-consumer.sh"
"package:check" = [
  { task = "package:metadata" },
  { task = "package:api" },
  { task = "package:docs" },
  { task = "package:msrv" },
  { task = "package:release-floor" },
  { task = "security:dependencies" },
  { task = "package:source-consumer" },
  { task = "qa" },
]

"qa" = [
  { task = "qa:docs" },
  { task = "qa:northstar" },
  { task = "qa:routes" },
  { task = "format:check" },
  { task = "lint:rust" },
  { task = "test:rust" },
]

"health" = [
  { task = "qa:northstar" },
  { task = "check:rust" },
]
