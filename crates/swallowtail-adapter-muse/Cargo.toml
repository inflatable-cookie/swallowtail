[package]
name = "swallowtail-adapter-muse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Meta Muse Code harness driver for Swallowtail"
autotests = false

[features]
live-probes = []

[lib]
doctest = false

[dependencies]
futures-channel = "0.3"
serde_json = "1"
swallowtail-core.workspace = true
swallowtail-runtime.workspace = true

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
swallowtail-host-local.workspace = true
swallowtail-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "corpus"
path = "tests/corpus.rs"

[[test]]
name = "live_installed_probe"
path = "tests/live_installed_probe.rs"
required-features = ["live-probes"]
